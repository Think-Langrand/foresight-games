  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

    height: 44px;

  }

  }

  }

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

.text-warning,

 {title:&#x27;Residents gain more influence over public spending.&#x27;,sources:[&#x27;Residents sit on budget panels that can overrule the department’s ranked priorities.&#x27;,&#x27;Lived experience carries more weight in hearings.&#x27;,&#x27;People who never attend are planned for by inference.&#x27;],experience:&#x27;Residents who attend panels can shape priorities. People unable to attend may have less influence.&#x27;,arrangement:&#x27;Budget panels use testimony and evidence to allocate funding. Participation depends on time, access and how people are invited.&#x27;,role:&#x27;We imagine public health helping people participate and bringing evidence into discussion. Residents may see it as a gatekeeper.&#x27;,question:&#x27;How could public decisions reflect people who are not in the room?&#x27;,fit:&#x27;The notes connect public influence with participation. Greater resident power does not guarantee that every resident has a voice.&#x27;,scope:&#x27;A resident working a night shift cannot attend a budget hearing.&#x27;,hopes:[{kind:&#x27;Hope&#x27;,text:&#x27;Participation becomes something we actively make possible.&#x27;,people:&#x27;Residents who are absent from formal decision-making.&#x27;,value:&#x27;People should have a meaningful say in decisions affecting their health.&#x27;},{kind:&#x27;Fear&#x27;,text:&#x27;The same few people decide for everyone.&#x27;,people:&#x27;Residents whose voices remain absent.&#x27;,value:&#x27;Public decisions should represent more than those able to attend.&#x27;}],assumption:&#x27;People must attend a formal hearing to influence the decision.&#x27;,alternative:&#x27;Combine hearings with outreach and other ways to contribute, and show how each contribution informs decisions.&#x27;,test:&#x27;Whose views still go unheard? Who decides how different contributions are weighed?&#x27;,fixed:&#x27;Residents have greater authority over public spending.&#x27;,desired:&#x27;Enable meaningful participation and make the reasoning behind public priorities visible.&#x27;,opportunity:&#x27;Funding could better reflect needs that formal hearings currently miss.&#x27;,risk:&#x27;The people collecting and interpreting contributions may still control whose views count.&#x27;,question4:&#x27;How could residents challenge the way their contributions are interpreted?&#x27;},
 {title:&#x27;Stable funding changes how departments set priorities and use staff capacity.&#x27;,sources:[&#x27;Grant-chasing, once a core survival skill, becomes surplus staff capacity.&#x27;,&#x27;Without scarcity to point to, departments lose a familiar justification for saying no.&#x27;,&#x27;Long-horizon prevention becomes fundable, but staff have limited experience planning at that range.&#x27;],experience:&#x27;Teams could sustain prevention over a longer period. Communities may benefit later, while urgent needs still compete for attention.&#x27;,arrangement:&#x27;Stable funding creates room for longer commitments. The outcome depends on priority-setting authority, planning skills and how staff capacity is reassigned.&#x27;,role:&#x27;We imagine public health as a steward of long-term prevention. Others might see an organization deciding which needs must wait.&#x27;,question:&#x27;How would we justify priorities when short grant cycles no longer make those choices for us?&#x27;,fit:&#x27;The notes connect priority-setting and staff capacity. The claim that stable funding removes the reason to say no is one reading to examine.&#x27;,scope:&#x27;A team considers a prevention commitment whose benefits may take twenty years to appear.&#x27;,hopes:[{kind:&#x27;Hope&#x27;,text:&#x27;Stability lets us sustain prevention over the long term.&#x27;,people:&#x27;Communities whose health would benefit from sustained prevention.&#x27;,value:&#x27;Preventing future harm matters even when benefits arrive beyond a funding cycle.&#x27;},{kind:&#x27;Fear&#x27;,text:&#x27;Our portfolio grows until no priority has enough staff.&#x27;,people:&#x27;Staff and communities relying on promised services.&#x27;,value:&#x27;Commitments should be credible, focused and supported by enough capacity.&#x27;}],assumption:&#x27;Each department needs to develop its own long-term planning expertise.&#x27;,alternative:&#x27;Departments share planning expertise through a regional partnership, while local communities help set priorities.&#x27;,test:&#x27;What authority and relationships would shared planning require? Could smaller departments influence its priorities?&#x27;,fixed:&#x27;Funding is stable. Long-term prevention becomes possible.&#x27;,desired:&#x27;Steward long-term prevention with communities and partners, making priorities and trade-offs explicit.&#x27;,opportunity:&#x27;Maintain prevention work beyond short funding cycles and share scarce planning expertise.&#x27;,risk:&#x27;Long-term commitments could overlook changing needs or weaken local influence.&#x27;,question4:&#x27;What planning capability, review points and public accountability would this role require?&#x27;},
 {title:&#x27;Public health work spreads across agencies, changing responsibility and accountability.&#x27;,sources:[&#x27;Health staff spend more time inside other agencies’ processes.&#x27;,&#x27;When health improves, no single agency can claim it; when it worsens, ownership is unclear.&#x27;,&#x27;State and national agencies increasingly provide services rather than set direction.&#x27;],experience:&#x27;Health could inform more everyday decisions. Residents may struggle to identify who is responsible when problems persist.&#x27;,arrangement:&#x27;Several agencies contribute to health outcomes. Shared work needs responsibilities, evidence and routes for resolving disagreements.&#x27;,role:&#x27;We imagine public health connecting agencies. Others might see an adviser without the authority to require action.&#x27;,question:&#x27;How could responsibility remain clear when health work is shared?&#x27;,fit:&#x27;The notes connect wider participation in health with uncertain ownership. Shared work need not mean that nobody is responsible.&#x27;,scope:&#x27;A community raises a health concern involving housing and transport decisions.&#x27;,hopes:[{kind:&#x27;Hope&#x27;,text:&#x27;Health becomes part of routine decisions across agencies.&#x27;,people:&#x27;Residents affected by housing, transport and other public decisions.&#x27;,value:&#x27;The conditions that shape health deserve sustained attention.&#x27;},{kind:&#x27;Fear&#x27;,text:&#x27;A concern is passed between agencies without action.&#x27;,people:&#x27;Residents seeking a response to a shared problem.&#x27;,value:&#x27;People should be able to identify who will act and hold them accountable.&#x27;}],assumption:&#x27;Responsibility must belong to one agency for someone to be accountable.&#x27;,alternative:&#x27;Agencies agree distinct responsibilities and a shared route for residents to raise concerns.&#x27;,test:&#x27;Who can enforce responsibilities and resolve disputes? What happens if an agency does not act?&#x27;,fixed:&#x27;Public health work takes place across agencies.&#x27;,desired:&#x27;Connect agencies around shared health outcomes and make their responsibilities visible to residents.&#x27;,opportunity:&#x27;Health concerns could influence decisions before harm occurs.&#x27;,risk:&#x27;Coordination may add meetings without changing authority or action.&#x27;,question4:&#x27;What agreements and authority would make shared responsibility work?&#x27;}

  const skipDelay = 300;

    }

    if (activeTrigger === trigger) {
      return;
    }

    floating.style.visibility = &quot;hidden&quot;;

    setDescribedBy(trigger, true);

      activeTrigger === trigger ||
      pendingTrigger === trigger

    }

    }

    document.removeEventListener(&quot;focusout&quot;, handleLeave);

    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });

  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;

  let storage = null;
  let state = null;

    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;

    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }

      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";

        anchor.click();
        anchor.remove();

      return;
    }

        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true

  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");

    channel.port1.postMessage({ type: "measure" });

    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },

    { once: true },

  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
