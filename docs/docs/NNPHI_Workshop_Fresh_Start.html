  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);

    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

  display: block;

  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

    height: 44px;

  }

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

}

.text-warning,

&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;dg-start&#x27;),content=root.querySelector(&#x27;#start-content&#x27;);
const notes=[
&#x27;Residents sit on budget panels that can overrule the health department’s ranked priorities.&#x27;,
&#x27;Grant-chasing, once the core survival skill of the department, becomes surplus staff capacity.&#x27;,
&#x27;Public health staff spend most of their time inside other agencies’ processes.&#x27;,
&#x27;Lived experience becomes the strongest currency in a hearing and data becomes the supporting actor.&#x27;,
&#x27;Neighbouring jurisdictions adopt incompatible rules and people simply route around them.&#x27;,
&#x27;Genuinely long-horizon prevention becomes fundable for the first time, but almost nobody on staff has planned at that range.&#x27;,
&#x27;Accountability blurs: when health improves no single agency can claim it, and when it worsens none owns it.&#x27;,
&#x27;The people who never turn up are planned for by inference rather than by contact.&#x27;,
&#x27;Sectors that can show a photogenic result outcompete those whose benefit only appears in twenty years.&#x27;,
&#x27;Without scarcity to point at, the department loses its main justification for saying no to anything.&#x27;,
&#x27;Small jurisdictions cannot staff specialised functions, so they quietly go without them.&#x27;,
&#x27;Ten-year plans lock in the preferences of whoever happened to be in the room in year one.&#x27;,
&#x27;State and national agencies lose the standing to set direction and become service providers instead.&#x27;,
&#x27;Departments start building coalitions with the sectors they used to simply advise.&#x27;
];
const blank=()=&gt;({title:&#x27;&#x27;,sources:[],fit:&#x27;&#x27;,scope:&#x27;&#x27;,experience:&#x27;&#x27;,arrangement:&#x27;&#x27;,role:&#x27;&#x27;,question:&#x27;&#x27;,other:&#x27;&#x27;,hopes:[],fixed:&#x27;&#x27;,assumption:&#x27;&#x27;,alternative:&#x27;&#x27;,test:&#x27;&#x27;,desired:&#x27;&#x27;,opportunity:&#x27;&#x27;,risk:&#x27;&#x27;,question4:&#x27;&#x27;,share:false});
let state={step:0,theme:0,sub:&#x27;values&#x27;,selected:0,picked:[],themes:[],editor:false,readings:false};
const valid=s=&gt;s?.version===&#x27;empty-1&#x27;&amp;&amp;Array.isArray(s.themes)&amp;&amp;Array.isArray(s.picked);
const saved=window.openai?.widgetState?.privateContent;if(valid(saved))state={...state,...saved};

const labels=[&#x27;Find themes&#x27;,&#x27;Explore themes&#x27;,&#x27;Values &amp; alternatives&#x27;,&#x27;Public health’s role&#x27;];

const name=(t,i)=&gt;t.title||`Untitled theme ${i+1}`;
const field=(key,label,value,help=&#x27;&#x27;,placeholder=&#x27;Capture the group’s response…&#x27;,disabled=false)=&gt;`&lt;div class=&quot;field&quot;&gt;&lt;label for=&quot;start-${key}&quot;&gt;${label}&lt;/label&gt;${help?`&lt;p class=&quot;help&quot;&gt;${help}&lt;/p&gt;`:&#x27;&#x27;}&lt;textarea id=&quot;start-${key}&quot; data-field=&quot;${key}&quot; placeholder=&quot;${esc(placeholder)}&quot; ${disabled?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;${esc(value)}&lt;/textarea&gt;&lt;/div&gt;`;
const promptList=()=&gt;`&lt;div class=&quot;guidance&quot; ${design.guidance?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;&lt;div class=&quot;eyebrow blue&quot;&gt;Facilitation prompts&lt;/div&gt;&lt;ol&gt;&lt;li&gt;&lt;strong&gt;What connects these implications?&lt;/strong&gt;&lt;br&gt;A change in how people live or how something works.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;What is changing—and for whom?&lt;/strong&gt;&lt;br&gt;Try: “___ is changing, which could mean ___ for ___.”&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Which notes support or complicate that reading?&lt;/strong&gt;&lt;br&gt;Keep different readings visible.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Is this a useful size to explore?&lt;/strong&gt;&lt;br&gt;Split it if too broad; connect it if it only repeats one note.&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;`;

function context(){const t=current();return t?`${state.themes.length&gt;1?`&lt;div class=&quot;selector&quot;&gt;&lt;span class=&quot;eyebrow&quot;&gt;Theme&lt;/span&gt;${state.themes.map((a,i)=&gt;`&lt;button type=&quot;button&quot; data-theme=&quot;${i}&quot; class=&quot;cursor-interaction&quot; aria-pressed=&quot;${i===state.theme}&quot; aria-label=&quot;${esc(name(a,i))}&quot;&gt;${i+1}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}&lt;div class=&quot;theme-context&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;The change we see&lt;/div&gt;&lt;h2&gt;${esc(name(t,state.theme))}&lt;/h2&gt;&lt;/div&gt;&lt;details class=&quot;source-box&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;View ${t.sources.length} linked implications&lt;/summary&gt;${t.sources.map(i=&gt;`&lt;div class=&quot;note&quot;&gt;${esc(notes[i])}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/details&gt;`:`&lt;div class=&quot;empty&quot;&gt;&lt;h3&gt;No themes yet&lt;/h3&gt;&lt;p&gt;The questions below are ready for your group. First, connect some implications into a theme.&lt;/p&gt;&lt;button type=&quot;button&quot; class=&quot;text-action cursor-interaction&quot; data-step=&quot;0&quot;&gt;Go to Find themes →&lt;/button&gt;&lt;/div&gt;`;}

const boardPrompts=()=&gt;`&lt;div class=&quot;board-prompts&quot; ${design.guidance?&#x27;&#x27;:&#x27;hidden&#x27;}&gt;&lt;div class=&quot;eyebrow blue&quot;&gt;As you group and name themes&lt;/div&gt;&lt;ol&gt;&lt;li&gt;What connected change do these implications describe?&lt;/li&gt;&lt;li&gt;What is changing—and for whom?&lt;/li&gt;&lt;li&gt;Which implications support or complicate that reading?&lt;/li&gt;&lt;/ol&gt;&lt;p class=&quot;small muted&quot;&gt;If a theme is too broad, split it. If it repeats one note, look for related implications.&lt;/p&gt;&lt;/div&gt;`;
